name: CI

# 目标平台是 Windows + macOS，两端各跑一次原生 `cargo check` 与 `cargo test --lib`：
# 本机（macOS）永远看不到 `#[cfg(target_os = "windows")]` 分支，Windows job 才是唯一可靠验证器。
# 快层 L2 / L3（vitest · node）与测试纪律扫描、FLAKY 棘轮同样双端门禁：L2/L3 不触网、
# 不用真实 Provider，夹具一律走 `os.tmpdir()` 与 node:path，不依赖某一端的 shell 或分隔符。
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 字段裁定：action-setup@v4 没有 version 输入时读该字段。
      # 不在这里重复写版本号，避免 CI 与本地装到不同的 pnpm。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 各平台用各自的原生 target，无需 rustup target add。
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # = vue-tsc --noEmit && cargo check --manifest-path src-tauri/Cargo.toml
      # cargo 侧解析到仓库根 workspace，Cargo.lock 与 target/ 均在仓库根。
      - run: pnpm run test:types

      # = cargo test --manifest-path src-tauri/Cargo.toml --lib
      # 单测与 check 一样按平台原生编译运行；`#[cfg(unix)]`/`#[cfg(windows)]` 分支只在对应 job 生效。
      - run: pnpm run test:rust

      # = vitest run --project unit（scripts/run-vitest-with-retry.mjs 包一层：失败重试一次、
      # 重试才通过的标 ⚠ FLAKY；跳过与超时永远不算通过 —— 契约「测试纪律」规则 8）
      - run: node scripts/run-vitest-with-retry.mjs unit

      # = vitest run --project integration：L3 走临时数据根 + fake Provider，不触网
      - run: node scripts/run-vitest-with-retry.mjs integration

      # 测试纪律扫描（契约规则 3 / 4 / 5 / 6 / 7），命中即失败
      - run: node scripts/check-test-rules.mjs

      # FLAKY 棘轮：只缩不放，观测到基线（test/flaky-baseline.json）之外的新 FLAKY 即失败
      - run: node scripts/check-flaky-ratchet.mjs
