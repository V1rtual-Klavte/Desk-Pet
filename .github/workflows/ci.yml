name: CI

# 目标平台是 Windows + macOS，两端各跑一次原生 `cargo check` 与 `cargo test --lib`：
# 本机（macOS）永远看不到 `#[cfg(target_os = "windows")]` 分支，Windows job 才是唯一可靠验证器。
# 快层 L2 / L3（vitest · node）与测试纪律扫描、FLAKY 棘轮同样双端门禁：L2/L3 不触网、
# 不用真实 Provider，夹具一律走 `os.tmpdir()` 与 node:path，不依赖某一端的 shell 或分隔符。
on:
  push:
    # ⚠️ branches 必须**显式写全**：GitHub 的 push 事件规则是「只定义 tags/tags-ignore 或只定义
    # branches/branches-ignore 时，另一侧 ref 的事件不触发」。2026-10-03 把裸 `push:` 收窄成
    # 只有 `tags-ignore` 之后，**分支推送一声不响地不再触发 CI**（10-05 才发现，中间所有分支推送
    # 都没有门禁）。删 tags-ignore 又会踩回旧问题：同一个 SHA 在 verify 上白跑一遍双平台。
    branches: ["**"]
    # v* tag 由 release.yml 负责：不排除的话同一 SHA 会在 verify 上白跑一遍双平台（且并不阻塞 release）
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 字段裁定：action-setup@v4 没有 version 输入时读该字段。
      # 不在这里重复写版本号，避免 CI 与本地装到不同的 pnpm。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 各平台用各自的原生 target，无需 rustup target add。
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # = tsc --noEmit && cargo check
      # cargo 在仓库根 workspace 上跑（成员：crates/native-host），
      # Cargo.lock 与 target/ 均在仓库根。
      - run: pnpm run test:types

      # = cargo test --lib -p native-host
      # 单测与 check 一样按平台原生编译运行；`#[cfg(unix)]`/`#[cfg(windows)]` 分支只在对应 job 生效。
      - run: pnpm run test:rust

      # = vitest run --project unit（scripts/run-vitest-with-retry.mjs 包一层：失败重试一次、
      # 重试才通过的标 ⚠ FLAKY；跳过与超时永远不算通过 —— 契约「测试纪律」规则 8）
      - run: node scripts/run-vitest-with-retry.mjs unit

      # = vitest run --project integration：L3 走临时数据根 + fake Provider，不触网
      - run: node scripts/run-vitest-with-retry.mjs integration

      # 测试纪律扫描（契约规则 3 / 4 / 5 / 6 / 7），命中即失败
      - run: node scripts/check-test-rules.mjs

      # FLAKY 棘轮：只缩不放，观测到基线（test/flaky-baseline.json）之外的新 FLAKY 即失败
      - run: node scripts/check-flaky-ratchet.mjs

  # 打包配置守卫：秒级、不装 Rust、不跑构建。Release 模式构建在 macOS runner 上按 10 倍
  # 计费，所以平时的 push/PR 只用静态检查守住配置漂移；真正的双平台构建在 release.yml。
  bundle-config:
    name: bundle-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本与 tag 的一致性检查需要 pnpm 与 node，但不需要安装依赖
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # GITHUB_REF_NAME 在任何触发下都会被设置（push 时是分支名、pull_request 时是 `123/merge`），
      # 只有 GITHUB_REF_TYPE === "tag" 时它才是 tag，脚本据此决定是否校验版本一致性
      #（见 scripts/check-bundle-config.mjs 的 resolveTag）。
      - run: pnpm run check:bundle
