# ==========================================
# Profile: 暗夜紫 (dark-purple)
# 暗色主题预设
# ==========================================

meta:
  name: "暗夜紫"
  description: "暗色主题"
  version: 3
  builtin: true
  preset: dark

# ── 主题 ──
theme:
  colors:
    # 背景
    背景: "#1a1025"
    卡片背景: "#251530"
    聊天背景: "#1a1025"
    # 边框
    边框: "#7a3a6a"
    分割线: "#5a3a6a"
    输入边框: "#4a3055"
    # 文字
    主文字: "#e0d0e8"
    亮文字: "#e8d8f0"
    粉色文字: "#d0a0d8"
    暗文字: "#8a7090"
    # 强调
    强调色: "#c06aaf"
    强调悬浮: "#d08ac0"
    # 标题栏
    标题栏渐变起: "#5a3070"
    标题栏渐变止: "#8a4a8a"
    标题栏文字: "#e8d8f0"
    # 表面
    表面色: "#2a1835"
    深表面色: "#1f1230"
    # 弹窗
    遮罩: "rgba(8,2,14,0.75)"
    # 透明玻璃
    透明背景: "rgba(26,16,37,0.35)"
    模糊度: "0px"
  fonts:
    ui: "zpix"
    chat: "zpix"
    size: 14
  shield:
    enabled: false
    image: ""
  parallax:
    intensity: 1.0
    layers:
      - { enabled: true, image: "materials/bg_base.png", sensitivity: 0.2, shadow: 0.25, brightness: 0.93, contrast: 0.96, saturate: 0.92 }
      - { enabled: false, image: "", sensitivity: 0.5, shadow: 0.18, brightness: 0.95, contrast: 0.98, saturate: 0.95 }
      - { enabled: true, image: "materials/body.png", sensitivity: 0.8, shadow: 0.12, brightness: 1.00, contrast: 1.00, saturate: 1.00 }
      - { enabled: false, image: "", sensitivity: 1.2, shadow: 0.06, brightness: 1.02, contrast: 1.02, saturate: 1.05 }
      - { enabled: true, image: "materials/shield_gold.png", sensitivity: 1.6, shadow: 0.03, brightness: 1.03, contrast: 1.03, saturate: 1.08 }

# ── 音效 ──
sound:
  volume: 0.8
  events:
    welcome: "welcome_chord"
    send: "send_short"
    reply: "reply_ding"
    popup: "popup_up"
    retract: "retract_down"
    surface: "surface_light"
    middle: "middle_tremolo"
    deep: "deep_noise"
