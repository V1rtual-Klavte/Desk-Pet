# ==========================================
# 糖糖桌宠 全局配置
# 功能域：general / ai / tools / appearance
# 主题/角色/音效 → 由运行时 data_root/profiles/ 管理
# 开发环境无 CONFIG-DEV.yaml 时使用本文件；修改后重启桌宠使运行时配置重新加载
# ==========================================

# ══════════════════════════════════════════
# 1. 通用设置 (General)
# ══════════════════════════════════════════
general:
  mode:
    assistant: false

  popup:
    mode: cursor
    autoPopupOnMessage: false
    defaultSize: { w: 730, h: 450 }
    fixedPosition: null
    chatWidth: 220

  shortcut:
    key: "P"
    macModifiers: ["Control", "Command"]
    winModifiers: ["Control", "Alt"]

  logging:
    level: info

  errors:
    # 未捕获异常的覆盖层行为
    #   auto   = dev 弹、生产不弹（推荐）
    #   always = 两端都弹
    #   never  = 两端都不弹，只写日志 + 上报 Rust
    overlay: auto

  desktop:
    pollingIntervalMs: 3000
    pauseExtraMs: 5000
    waitTimeoutMs: 5000

# ══════════════════════════════════════════
# 2. AI 设置 (AI)
# ══════════════════════════════════════════
ai:
  provider: deepseek
  endpoint: https://api.deepseek.com
  apiKey: ""
  requireApiKey: true
  model: deepseek-chat
  contextMaxTokens: 16000

  thinking:
    effort: auto

  personality:
    active: angelkawaii

  loop:
    maxRetry: 3
    maxToolCallsPerTurn: 5
    toolTimeoutMs: 30000
    turnTimeoutMs: 120000
    dedupWindowMs: 30000
    maxVisibleMessages: 200

  memory:
    maxEntries: 200
    maxSessions: 20

  plan:
    enabled: true
    complexityThreshold: 3
    maxSteps: 8
    stepTimeoutMs: 90000
    stepMaxRounds: 5
    thinkingEffort: medium
    stepThinkingEffort: low
    onStepFailure: continue
    keywords:
      - 分析
      - 整理
      - 重构
      - 修复
      - 审查
      - 合并
      - 总结
      - 生成
      - 创建项目

  lock:
    safetyTimeoutMs: 30000

  windowMonitor:
    enabled: true
    staySeconds: 60
    settleMs: 2000
    # 冷却时长统一毫秒。原 cooldownSeconds 写 5000 却被当秒用，实际冷却 83 分钟。
    cooldownMs: 5000
    samePageCooldownMs: 7800
    resumeExtraMs: 2000

  safety:
    mode: tell_me
    sessionTrustEnabled: true

# ══════════════════════════════════════════
# 3. 工具配置 (Tools)
# ══════════════════════════════════════════
tools:
  bash:
    whitelist: ["ls", "cat", "head", "tail", "grep", "find", "which",
                "echo", "pwd", "date", "whoami", "uname", "df", "du",
                "ps", "tasklist", "system_profiler", "ifconfig"]

  file:
    writeEnabled: true

  mcp:
    enabled: false
    servers: []
    builtin:
      filesystem:
        enabled: true
        command: npx
        args: ["-y", "@modelcontextprotocol/server-filesystem", "/"]
        description: "📁 文件系统操作 — 读写/搜索本地文件"
      brave-search:
        enabled: false
        command: npx
        args: ["-y", "@brave/brave-search-mcp-server"]
        env: { BRAVE_API_KEY: "" }
        description: "🔍 Brave Search — 网页搜索（需 API Key）"
      playwright:
        enabled: true
        command: npx
        args: ["-y", "@executeautomation/playwright-mcp-server"]
        description: "🎭 Playwright — 无头浏览器自动化测试"
      git:
        enabled: false
        command: npx
        args: ["-y", "@anthropic/mcp-git", "/"]
        description: "📝 Git — 版本控制操作"
      github:
        enabled: false
        command: npx
        args: ["-y", "@anthropic/mcp-github"]
        env: { GITHUB_PERSONAL_ACCESS_TOKEN: "" }
        description: "🐙 GitHub — 仓库/Issue/PR 管理（需 Token）"

  skill:
    # Skill 首回合只列元数据，正文由 read 工具按需读取；pet/both policy 可用于轻量模式。
    enabled: false

# ══════════════════════════════════════════
# 4. 外观 — Profile 系统
# ══════════════════════════════════════════
# 主题/角色/音效配置位于运行时 data_root/profiles/ 目录
# 每个 profile 是一个自包含文件夹，拖入即用
appearance:
  activeProfile: "sugar-pink"     # 当前激活的 Profile ID
  effectMode: "off"               # 角色展示效果: off | parallax(灵动图层) | dof(景深)，互斥
  soundAssignments: {}
  parallax:
    intensity: 1.0                # 灵动图层的全局强度；逐层参数在 Profile 的 theme.parallax.layers
