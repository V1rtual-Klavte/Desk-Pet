# ==========================================
# 虚拟桌宠 全局配置
# 功能域：general / ai / tools / appearance
# 主题/角色/音效 → 由运行时 data_root/profiles/ 管理
# 开发环境无 CONFIG-DEV.yaml 时使用本文件；修改后重启桌宠使运行时配置重新加载
# ==========================================

# ══════════════════════════════════════════
# 1. 通用设置 (General)
# ══════════════════════════════════════════
general:
  popup:
    mode: fixed
    autoPopupOnMessage: false
    defaultSize: { w: 673, h: 444 }
    fixedPosition: { x: 252, y: 285 }
    chatWidth: 266

  shortcut:
    key: "P"
    macModifiers: ["Control", "Command"]
    winModifiers: ["Control", "Alt"]

  logging:
    level: info

  errors:
    # 未捕获异常的覆盖层行为
    #   auto   = dev 弹、生产不弹（推荐）
    #   always = 两端都弹
    #   never  = 两端都不弹，只写日志 + 上报 Rust
    overlay: auto

# ══════════════════════════════════════════
# 2. AI 设置 (AI)
# ══════════════════════════════════════════
ai:
  provider: deepseek
  endpoint: https://api.deepseek.com
  apiKey: ""
  requireApiKey: true
  model: deepseek-flash
  # 辅助模型：子代理（agent_spawn 工具、计划步骤）、主动扫描规划与记忆整理（dreaming）使用；
  # 留空跟随聊天模型。与聊天共用同一 provider/endpoint/apiKey。
  auxModel: ""
  # 上下文窗口（tokens）：默认 256k，最低 65536。再低时压缩找不到可摘要范围，
  # 设置页会拒绝保存，运行期会在模型解析处报错。
  contextMaxTokens: 262144

  thinking:
    effort: auto

  conversation:
    # 忙碌时未显式选择的默认投递方式：steer=插话（当前响应结束后处理）、followUp=稍后继续（当前任务结束后继续）。
    # 单条显式选择优先；空闲时两种方式都直接开始正常回合。
    defaultDelivery: steer
    # 插话批量策略：all=同一安全边界前积压的补充一起进入下一次请求；one-at-a-time=逐条处理。
    steeringMode: all
    # 稍后继续的批量策略：one-at-a-time=逐条保留后续话题边界；all=集中处理。
    followUpMode: one-at-a-time

  personality:
    active: yuki

  loop:
    maxRetry: 3
    # agent 子代理工具轮上限（无人值守子运行）；主聊天回合已无计数上限，走循环病理检测
    subAgentRounds: 5
    toolTimeoutMs: 30000
    # 主回合/恢复的墙钟；必须 ≥ bash 档位（5 分钟）+ 一次模型往返，否则长命令被回合整体 abort。
    turnTimeoutMs: 600000
    dedupWindowMs: 30000
    maxVisibleMessages: 200
    # 同时执行的只读（shared_read）工具数上限，范围 1–8。效果类工具始终与其它执行互斥，
    # 不受它影响；每个 run 开始前下发给 Rust 许可所有者，运行期间不撤销已借出的额度。
    maxParallelTools: 4

  memory:
    enabled: true
    coreTokenBudget: 320
    recallTokenBudget: 1000
    rerank: off
    recallTimeoutMs: 4000
    rerankTimeoutMs: 2500
    dreaming:
      # 记忆整理档位：off(不自动整理，面板手动整理入口保留) | low | medium | high
      # 档位值（空闲阈值 / 最小间隔）收进 src/services/proactive/protocol.json 的 tiers，越高越勤；
      # 每日 token 上限已撤除（2026-10-06）：token 只记账，不阻止/中止整理。
      tier: medium
      # reviewMaxTokens：单次 Review 输出上限；留空/删掉 = 按模型输出预算自动推导（窗口×1/8，32k 封顶，且不越过模型目录上限）
      # reviewMaxTokens: 4096
    maxSessions: 20

  plan:
    enabled: true
    complexityThreshold: 3
    # 复杂度评估方式：keyword 只用关键词判定（未命中直接低分，不额外请求模型）；
    # llm 在未命中关键词时再发一次独立请求自判。--plan 强制触发不受它影响。
    complexityEval: keyword
    maxSteps: 8
    # 单个计划步骤的墙钟；计划由用户在场批准，按 bash 档位（5 分钟）对齐，避免 90s 截断长命令。
    stepTimeoutMs: 300000
    stepMaxRounds: 5
    thinkingEffort: medium
    stepThinkingEffort: low
    onStepFailure: continue
    keywords:
      - 分析
      - 整理
      - 重构
      - 修复
      - 审查
      - 合并
      - 总结
      - 生成
      - 创建项目

  humanizer:
    enabled: true

  # 主动消息：总闸 + 频率 + 静默时间段（静默时段仅约束主动消息）
  proactive:
    # off(不唤醒 / 不产生机会 / 不发送) | low | medium | high
    # 随机唤醒（不形成固定节拍）：低每 2–5 小时、中每 30–90 分钟、高每 10–30 分钟一次；
    # 体感 低≈1–2 条/天、中≈2–4 条/天、高≈4–8 条/天；「高」档 token 约 5 倍。
    frequency: medium
    # 静默时间段（本地小时，0–23 整数）：该时段不唤醒 / 不产生机会 / 不发送。
    # 跨夜语义 start > end（默认 23 开始、9 结束）；start == end = 不静默；白天不设窗口。
    quietStartHour: 23
    quietEndHour: 9

  silentAccess:
    # 静默了解总闸 + 频率：off(不自动跑，读取靠手动) | low | medium | high
    # （原 enabled 与四个数值字段 staySeconds/settleMs/cooldownMs/samePageCooldownMs 已删：
    #   四个数值属主动消息节奏，收进 proactive/protocol.json 的 tiers。）
    frequency: medium

  safety:
    mode: tell_me
    sessionTrustEnabled: true

# ══════════════════════════════════════════
# 3. 工具配置 (Tools)
# ══════════════════════════════════════════
tools:
  bash:
    whitelist: ["ls", "cat", "head", "tail", "grep", "find", "which",
                "echo", "pwd", "date", "whoami", "uname", "df", "du",
                "ps", "tasklist", "system_profiler", "ifconfig"]

  mcp:
    # 无总闸：按每服务器 enabled 控制，全部关闭即不使用 MCP。
    # 服务器列表。transport: stdio 用 command/args/env（npx -y <包> 形态由宿主托管安装后直启，失败回退 npx）；
    # transport: http 用 url/headers（Streamable HTTP，headers 值支持 ${ENV_VAR}：先查本条目 env，
    # 未命中再查应用自有凭据存储 —— 凭据值不写在本文件里）。
    servers:
      # GitHub 官方远程 MCP：出厂自带、默认关闭（enabled: false = 开箱不连接）。
      # 端点对所有 GitHub 用户免费（无需 Copilot 席位；域名带 copilot 是历史命名）；
      # 纯在线依赖：无网络不可用。
      # X-MCP-Readonly: true = 只暴露只读工具；X-MCP-Toolsets 限定工具面（省 token）。
      # GITHUB_TOKEN 不写在文件里：在设置 → 工具 → MCP 的「GitHub 令牌」行动作填入
      # fine-grained、只读权限的 PAT；值存应用自有数据库（不回显、不进日志）。
      - name: github
        transport: http
        url: https://api.githubcopilot.com/mcp/
        headers:
          X-MCP-Readonly: "true"
          X-MCP-Toolsets: "context,repos,issues,pull_requests"
          Authorization: "Bearer ${GITHUB_TOKEN}"
        enabled: false

# ══════════════════════════════════════════
# 4. 外观 — Profile 系统
# ══════════════════════════════════════════
# 主题/角色/音效配置位于运行时 data_root/profiles/ 目录
# 每个 profile 是一个自包含文件夹，拖入即用
appearance:
  activeProfile: "yuki"           # 当前激活的 Profile ID
  effectMode: "parallax"          # 角色展示效果: off(静态) | parallax(灵动图层)，互斥
  theme: "nightfall"              # 界面主题（产品级预设，与 Profile 正交）: brushed(拉丝金属) | chrome(铬) | verdigris(铜绿) | nightfall(暮蓝) | azurite(青花)
  chatImagePreview: true          # 聊天图片自动预览: false(默认，历史只显示占位，点击占位仍可打开查看器) | true(只为可见消息按需加载内联预览)
  soundAssignments: {}
  parallax:
    intensity: 1.0                # 灵动图层的全局强度；逐层参数在 Profile 的 theme.parallax.layers
  font:
    family: ""                    # 全局字体（用户电脑上已安装的字体名）；空 = 跟随系统默认字体栈
    size: 14                      # 全局字号 px
