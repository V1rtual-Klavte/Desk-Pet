# ==========================================
# 虚拟桌宠 全局配置
# 功能域：general / ai / tools / appearance
# 主题/角色/音效 → 由运行时 data_root/profiles/ 管理
# 开发环境无 CONFIG-DEV.yaml 时使用本文件；修改后重启桌宠使运行时配置重新加载
# ==========================================

# ══════════════════════════════════════════
# 1. 通用设置 (General)
# ══════════════════════════════════════════
general:
  popup:
    mode: cursor
    autoPopupOnMessage: false
    defaultSize: { w: 730, h: 450 }
    fixedPosition: null
    chatWidth: 220

  shortcut:
    key: "P"
    macModifiers: ["Control", "Command"]
    winModifiers: ["Control", "Alt"]

  logging:
    level: info

  errors:
    # 未捕获异常的覆盖层行为
    #   auto   = dev 弹、生产不弹（推荐）
    #   always = 两端都弹
    #   never  = 两端都不弹，只写日志 + 上报 Rust
    overlay: auto

  desktop:
    pollingIntervalMs: 3000

# ══════════════════════════════════════════
# 2. AI 设置 (AI)
# ══════════════════════════════════════════
ai:
  provider: deepseek
  endpoint: https://api.deepseek.com
  apiKey: ""
  requireApiKey: true
  model: deepseek-chat
  # 辅助模型：子代理（agent_spawn 工具、计划步骤）、主动扫描规划与记忆整理（dreaming）使用；
  # 留空跟随聊天模型。与聊天共用同一 provider/endpoint/apiKey。
  auxModel: ""
  # 上下文窗口（tokens）：默认 128k，最低 65536。再低时压缩找不到可摘要范围，
  # 设置页会拒绝保存，运行期会在模型解析处报错。
  contextMaxTokens: 131072

  thinking:
    effort: auto

  conversation:
    # 忙碌时未显式选择的默认投递方式：steer=插话（当前响应结束后处理）、followUp=稍后继续（当前任务结束后继续）。
    # 单条显式选择优先；空闲时两种方式都直接开始正常回合。
    defaultDelivery: steer
    # 插话批量策略：all=同一安全边界前积压的补充一起进入下一次请求；one-at-a-time=逐条处理。
    steeringMode: all
    # 稍后继续的批量策略：one-at-a-time=逐条保留后续话题边界；all=集中处理。
    followUpMode: one-at-a-time

  personality:
    active: angelkawaii

  loop:
    maxRetry: 3
    maxToolCallsPerTurn: 5
    toolTimeoutMs: 30000
    turnTimeoutMs: 120000
    dedupWindowMs: 30000
    maxVisibleMessages: 200
    # 同时执行的只读（shared_read）工具数上限，范围 1–8。效果类工具始终与其它执行互斥，
    # 不受它影响；每个 run 开始前下发给 Rust 许可所有者，运行期间不撤销已借出的额度。
    maxParallelTools: 4

  memory:
    enabled: true
    coreTokenBudget: 320
    recallTokenBudget: 1000
    rerank: off
    recallTimeoutMs: 4000
    rerankTimeoutMs: 2500
    dreaming:
      mode: idle
      idleSeconds: 120
      minIntervalMinutes: 60
      # 每日自动整理预算：按 128k 窗口、3 批最坏预留（3×8k 输入 + 3×16k 输出）校准；0 = 禁用自动整理
      maxDailyTokens: 72000
      # reviewMaxTokens：单次 Review 输出上限；留空/删掉 = 按模型输出预算自动推导（窗口×1/8，32k 封顶，且不越过模型目录上限）
      # reviewMaxTokens: 4096
    maxSessions: 20

  plan:
    enabled: true
    complexityThreshold: 3
    # 复杂度评估方式：keyword 只用关键词判定（未命中直接低分，不额外请求模型）；
    # llm 在未命中关键词时再发一次独立请求自判。--plan 强制触发不受它影响。
    complexityEval: keyword
    maxSteps: 8
    stepTimeoutMs: 90000
    stepMaxRounds: 5
    thinkingEffort: medium
    stepThinkingEffort: low
    onStepFailure: continue
    keywords:
      - 分析
      - 整理
      - 重构
      - 修复
      - 审查
      - 合并
      - 总结
      - 生成
      - 创建项目

  lock:
    safetyTimeoutMs: 30000

  windowMonitor:
    enabled: true
    staySeconds: 60
    settleMs: 2000
    # 冷却时长统一毫秒。原 cooldownSeconds 写 5000 却被当秒用，实际冷却 83 分钟。
    cooldownMs: 5000
    samePageCooldownMs: 7800

  safety:
    mode: tell_me
    sessionTrustEnabled: true

# ══════════════════════════════════════════
# 3. 工具配置 (Tools)
# ══════════════════════════════════════════
tools:
  bash:
    whitelist: ["ls", "cat", "head", "tail", "grep", "find", "which",
                "echo", "pwd", "date", "whoami", "uname", "df", "du",
                "ps", "tasklist", "system_profiler", "ifconfig"]

  mcp:
    # 无总闸：按每服务器 enabled 控制，全部关闭即不使用 MCP。
    # 内置五项默认关闭：总闸删除前它们由 mcp.enabled 关住，默认值必须保持今天实际生效的状态。
    servers: []
    builtin:
      filesystem:
        enabled: false
        command: npx
        args: ["-y", "@modelcontextprotocol/server-filesystem", "/"]
        description: "📁 文件系统操作 — 读写/搜索本地文件"
      brave-search:
        enabled: false
        command: npx
        args: ["-y", "@brave/brave-search-mcp-server"]
        env: { BRAVE_API_KEY: "" }
        description: "🔍 Brave Search — 网页搜索（需 API Key）"
      playwright:
        enabled: false
        command: npx
        args: ["-y", "@executeautomation/playwright-mcp-server"]
        description: "🎭 Playwright — 无头浏览器自动化测试"
      git:
        enabled: false
        command: npx
        args: ["-y", "@anthropic/mcp-git", "/"]
        description: "📝 Git — 版本控制操作"
      github:
        enabled: false
        command: npx
        args: ["-y", "@anthropic/mcp-github"]
        env: { GITHUB_PERSONAL_ACCESS_TOKEN: "" }
        description: "🐙 GitHub — 仓库/Issue/PR 管理（需 Token）"

# ══════════════════════════════════════════
# 4. 外观 — Profile 系统
# ══════════════════════════════════════════
# 主题/角色/音效配置位于运行时 data_root/profiles/ 目录
# 每个 profile 是一个自包含文件夹，拖入即用
appearance:
  activeProfile: "sugar-pink"     # 当前激活的 Profile ID
  effectMode: "off"               # 角色展示效果: off | parallax(灵动图层) | dof(景深)，互斥
  soundAssignments: {}
  parallax:
    intensity: 1.0                # 灵动图层的全局强度；逐层参数在 Profile 的 theme.parallax.layers
  font:
    family: ""                    # 全局字体（用户电脑上已安装的字体名）；空 = 跟随系统默认字体栈
    size: 14                      # 全局字号 px
