[package]
name = "v1rtual-desk-pet"
version = "0.15.0"
description = "虚拟桌宠"
edition = "2021"

[lib]
name = "v1rtual_desk_pet_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-global-shortcut = "2"
# 原生「另存为」对话框 —— 仅 Rust 侧使用，前端经自有命令调用
tauri-plugin-dialog = "2"
# 自动更新：检查/下载/安装走 GitHub Releases 静态端点
tauri-plugin-updater = "2"
# 更新安装后重启进程（relaunch）
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = ["macos-private-api", "image-png", "tray-icon", "protocol-asset"] }
num_cpus = "1"
# 本地时间戳（chrono::Local）—— 仅需 clock + std，不拉 serde/unicode
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 结构化错误类型
thiserror = "1"
# Profile 导出打包。只留 zlib-rs 的 deflate：
# 默认特性会拉入 zstd/bzip2/lzma/aes/sha2/ppmd 等一大串，而 `deflate` 本身还额外捆绑
# 了编译极慢的 zopfli。Profile 里绝大多数是已压缩的 PNG/WAV，多算法收益极低。
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Bundled SQLite keeps macOS and Windows on the same SQLite/FTS5 runtime.
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
sha2 = "0.10"
# 枚举系统已安装字体（设置/外观的全局字体选择）。纯 Rust 读取系统字体目录/注册表，
# 不链接系统库；目标平台只有 macOS 与 Windows，fontconfig（Linux 专用）不需要。
fontdb = { version = "0.24", default-features = false, features = ["fs", "std"] }

[target.'cfg(windows)'.dependencies]
# feature 必须覆盖每个符号所属模块，缺一个就只在 Windows 目标上编译失败。
# 0.52 的消费者只有本 crate（Tauri/tao/wry 走 0.59+），不存在 feature unification 兜底。
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",             # CloseHandle / HWND / BOOL / HANDLE
    "Win32_UI_WindowsAndMessaging", # GetForegroundWindow / GetWindowTextW / GetWindowThreadProcessId / GetCursorPos / SetWindowPos
    "Win32_Graphics_Gdi",           # GetMonitorInfoW / MonitorFromPoint / MONITORINFOEXW
    "Win32_UI_HiDpi",               # GetDpiForMonitor
    "Win32_System_Threading",       # OpenProcess / PROCESS_QUERY_INFORMATION / PROCESS_VM_READ
    "Win32_System_ProcessStatus",   # GetProcessImageFileNameW
    "Win32_System_SystemInformation", # GlobalMemoryStatusEx / MEMORYSTATUSEX
    "Win32_UI_Shell",               # ShellExecuteW（app_open 用它替代 cmd /C start）
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
